name: absen_aaj
description: "Absen AAJ - Aplikasi absensi karyawan (online MVP)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  test: ^1.31.1
  # Pinned to the sqlite3 2.x API so host tests can use the system SQLite
  # library instead of requiring a native C toolchain.
  sqflite_common_ffi: 2.3.7+1
  sqlite3: 2.9.4

flutter:
  uses-material-design: true